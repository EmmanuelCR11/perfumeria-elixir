  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --lav-bg:     #d8dcf4;
      --lav-mid:    #b8bde8;
      --lav-dark:   #8e95d4;
      --lav-deep:   #6b72be;
      --red:        #e02b3f;
      --white:      #ffffff;
      --text-dark:  #2e2e50;
      --text-mid:   #6b6b8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--lav-bg);
    }

    /* ── IFRAME FONDO ── */
    #mainIframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
      position: fixed;
      z-index: 1;
    }

    /* ── OVERLAY BLUR ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(190, 195, 235, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 2;
      pointer-events: none;
    }

    /* ── SILUETAS DE FONDO ── */
    .silhouettes {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    /* Good Girl - botella curvada izquierda */
    .sil-goodgirl {
      position: absolute;
      bottom: -10px;
      left: -18px;
      width: 120px;
      opacity: 0.18;
      animation: silFloat 5s ease-in-out infinite alternate;
    }
    /* Jadore - botella fina centro-izquierda */
    .sil-jadore {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-140px);
      width: 80px;
      opacity: 0.14;
      animation: silFloat 6s ease-in-out infinite alternate-reverse;
    }
    /* Coco Chanel - botella rectangular derecha */
    .sil-coco {
      position: absolute;
      bottom: -10px;
      right: -15px;
      width: 110px;
      opacity: 0.18;
      animation: silFloat 4.5s ease-in-out infinite alternate;
    }
    /* Gafas - arriba derecha */
    .sil-gafas {
      position: absolute;
      top: 12%;
      right: 4%;
      width: 100px;
      opacity: 0.13;
      animation: silFloatH 7s ease-in-out infinite alternate;
      transform: rotate(-12deg);
    }
    /* Segundo frasco pequeño - arriba izquierda */
    .sil-mini {
      position: absolute;
      top: 8%;
      left: 5%;
      width: 55px;
      opacity: 0.12;
      animation: silFloat 8s ease-in-out infinite alternate;
    }

    @keyframes silFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-14px); }
    }
    @keyframes silFloatH {
      from { transform: rotate(-12deg) translateY(0); }
      to   { transform: rotate(-8deg) translateY(-10px); }
    }

    /* ── DESTELLOS ── */
    .sparkle {
      position: fixed;
      z-index: 4;
      pointer-events: none;
      color: var(--lav-deep);
      animation: sparklePop 2.2s ease-in-out infinite alternate;
      opacity: 0.55;
    }
    .sp1 { top: 18%; right: 10%; font-size: 20px; animation-delay: 0s; }
    .sp2 { top: 60%; left:  6%; font-size: 14px; animation-delay: .8s; }
    .sp3 { bottom: 22%; right: 14%; font-size: 17px; animation-delay: 1.4s; }
    .sp4 { top: 35%; left: 10%; font-size: 11px; animation-delay: .4s; }
    @keyframes sparklePop {
      from { transform: scale(1) rotate(0deg);   opacity: .4; }
      to   { transform: scale(1.5) rotate(25deg); opacity: .9; }
    }

    /* ── CARD WRAP ── */
    .cardWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: min(390px, 90vw);
    }

    /* borde degradado */
    .cardBorder {
      background: linear-gradient(135deg, var(--lav-mid), var(--lav-deep), #c9a0dc);
      border-radius: 34px;
      padding: 3px;
      box-shadow: 0 28px 70px rgba(100,110,200,.28);
    }

    .promo {
      background: rgba(255,255,255,0.96);
      border-radius: 32px;
      padding: 26px 22px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* brillo interior */
    .promo::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: radial-gradient(ellipse at 60% 0%, rgba(200,205,245,.35) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── ETIQUETA PERFUMERÍA ── */
    .perfLabel {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--lav-deep);
      margin-bottom: 10px;
      opacity: .85;
    }

    /* ── HOT DAYS ── */
    .hotDaysRow {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .hotBadge {
      background: var(--red);
      color: var(--white);
      font-weight: 900;
      font-size: 19px;
      letter-spacing: 1.5px;
      padding: 4px 13px;
      border-radius: 8px 0 0 8px;
      line-height: 1.3;
      text-transform: uppercase;
    }
    .daysBadge {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 34px;
      color: var(--text-dark);
      padding-left: 8px;
      line-height: 1;
      letter-spacing: -1px;
    }

    /* ── NOMBRES PERFUMES ── */
    .perfNames {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 17px;
      color: var(--text-dark);
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.5;
      letter-spacing: .3px;
    }
    .perfNames span {
      color: var(--lav-deep);
      font-weight: 700;
    }
    .perfNames .plus {
      color: var(--red);
      font-style: normal;
      font-weight: 900;
    }
    .obsequio {
      display: inline-block;
      background: linear-gradient(90deg, var(--lav-deep), #c9a0dc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    /* ── PILL DESCUENTO ── */
    .discountPill {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: var(--red);
      border-radius: 999px;
      padding: 8px 38px 10px;
      margin-bottom: 14px;
      animation: pillPulse 2s ease-in-out infinite;
    }
    .discountPill .hasta {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,.8);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }
    .discountPill .pct {
      font-weight: 900;
      font-size: 42px;
      color: var(--white);
      line-height: 1;
      letter-spacing: -1px;
    }
    @keyframes pillPulse {
      0%,100% { transform: scale(1);    box-shadow: 0 8px 24px rgba(224,43,63,.28); }
      50%      { transform: scale(1.03); box-shadow: 0 12px 32px rgba(224,43,63,.44); }
    }

    /* ── CHIPS ── */
    .chipRow {
      display: flex;
      gap: 7px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12.5px;
      background: #eef0fb;
      color: var(--text-dark);
      border: 1.5px solid var(--lav-mid);
    }

    /* ── BOTÓN ── */
    @keyframes pulseBtn {
      0%,100% { transform: scale(1);    box-shadow: 0 10px 28px rgba(224,43,63,.26); }
      50%      { transform: scale(1.03); box-shadow: 0 14px 36px rgba(224,43,63,.44); }
    }
    .btn {
      border: none;
      width: 100%;
      height: 54px;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--white);
      background: var(--red);
      letter-spacing: .5px;
      animation: pulseBtn 1.4s ease-in-out infinite;
      transition: filter .15s ease;
      user-select: none;
    }
    .btn:active { transform: scale(.98); }
    .btn:hover  { filter: brightness(1.08); }

    .finePrint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-mid);
      font-weight: 700;
    }
  </style>
</head>

<body>

  <iframe

      <path d="M90 33 Q100 26 110 33" stroke="#8e95d4" stroke-width="6" stroke-linecap="round" fill="none"/>

      <rect x="110" y="10" width="62" height="46" rx="20" fill="#8e95d4"/>

      <rect x="116" y="16" width="50" height="34" rx="16" fill="#b8bde8" opacity=".5"/>
      <!-- varilla derecha -->
      <rect x="170" y="28" width="30" height="7" rx="3.5" fill="#8e95d4"/>
      <!-- reflejo lente izq -->
      <path d="M40 22 Q50 18 58 22" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Mini frasco extra -->
    <svg class="sil-mini" viewBox="0 0 50 130" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="25" cy="12" rx="10" ry="8" fill="#b8bde8"/>
      <rect x="20" y="18" width="10" height="12" rx="3" fill="#b8bde8"/>
      <ellipse cx="25" cy="80" rx="18" ry="38" fill="#b8bde8"/>

  </div>

  <!-- Destellos -->
  <span class="sparkle sp1">✦</span>
  <span class="sparkle sp2">✦</span>
  <span class="sparkle sp3">✦</span>
  <span class="sparkle sp4">✦</span>

  <!-- ══ CARD ══ -->
  <div class="cardWrap" role="dialog" aria-modal="true" aria-label="Oferta especial">

        <div class="perfLabel">✦ Perfumería de Lujo ✦</div>

  </div>

  <script>
    async function getUserLocation() {
      try {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        const el = document.getElementById('userCity');
        if (el && d && d.city) el.textContent = d.city;
      } catch(e) {}
    }
    document.addEventListener('DOMContentLoaded', getUserLocation);

    function redirectToIframeUrl() {
      const iframe = document.getElementById('mainIframe');
      window.location.href = iframe.src;
    }
  </script>
